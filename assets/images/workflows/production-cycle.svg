<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
  <title id="title">From a user problem to a safe release</title>
  <desc id="desc">An issue enters a project and milestone, then a branch and pull request. Review and checks lead to a release, followed by monitoring and feedback into the next issue.</desc>
  <rect width="800" height="390" rx="12" fill="#101827"/>
  <g font-family="Arial, sans-serif" fill="#f1f5f9">
    <text x="32" y="43" font-size="23" font-weight="700">One small change, end to end</text>
    <text x="32" y="70" font-size="15" fill="#cbd5e1">Ninja Mission Tracker: stop empty missions being saved</text>
    <g fill="#1e293b" stroke="#60a5fa" stroke-width="2">
      <rect x="32" y="104" width="220" height="82" rx="10"/>
      <rect x="290" y="104" width="220" height="82" rx="10"/>
      <rect x="548" y="104" width="220" height="82" rx="10"/>
      <rect x="548" y="246" width="220" height="82" rx="10"/>
      <rect x="290" y="246" width="220" height="82" rx="10"/>
      <rect x="32" y="246" width="220" height="82" rx="10"/>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="142" y="137">1. Write issue #12</text><text x="400" y="137">2. Plan the work</text><text x="658" y="137">3. Branch + PR</text>
      <text x="658" y="279">4. Review + checks</text><text x="400" y="279">5. Merge + deploy</text><text x="142" y="279">6. Observe + learn</text>
    </g>
    <g font-size="14" fill="#cbd5e1" text-anchor="middle">
      <text x="142" y="163">Problem + acceptance criteria</text><text x="400" y="163">Owner, board, milestone</text><text x="658" y="163">A focused fix + test</text>
      <text x="658" y="305">A second pair of eyes</text><text x="400" y="305">Record the released version</text><text x="142" y="305">Check the real user journey</text>
    </g>
    <g fill="none" stroke="#fb923c" stroke-width="3">
      <path d="M255 145h28m-8-7 8 7-8 7M513 145h28m-8-7 8 7-8 7M658 192v44m-7-8 7 8 7-8M541 287h-24m8-7-8 7 8 7M283 287h-24m8-7-8 7 8 7"/>
      <path d="M142 240v-44m-7 8 7-8 7 8" stroke-dasharray="5 4"/>
    </g>
    <text x="32" y="365" font-size="14" fill="#cbd5e1">Merged does not automatically mean deployed. Verify the release in its actual environment.</text>
  </g>
</svg>
