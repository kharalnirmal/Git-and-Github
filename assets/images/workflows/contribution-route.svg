<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">The open source contribution route</title>
  <desc id="desc">Start with the original upstream repository. Fork to your account, clone locally, work on a branch, push to your fork, and propose a pull request back to upstream. Review may send you back to edit and test.</desc>
  <rect width="800" height="430" rx="12" fill="#101827"/>
  <g font-family="Arial, sans-serif" fill="#f1f5f9">
    <text x="32" y="43" font-size="23" font-weight="700">Your fork is a workspace, not the destination</text>
    <g fill="#1e293b" stroke="#60a5fa" stroke-width="2">
      <rect x="32" y="90" width="310" height="100" rx="10"/><rect x="458" y="90" width="310" height="100" rx="10"/>
      <rect x="458" y="270" width="310" height="100" rx="10"/><rect x="32" y="270" width="310" height="100" rx="10"/>
    </g>
    <g font-size="19" font-weight="700">
      <text x="52" y="125">Original repository</text><text x="478" y="125">Your fork on GitHub</text>
      <text x="478" y="305">Local feature branch</text><text x="52" y="305">Pull request to upstream</text>
    </g>
    <g font-size="15" fill="#cbd5e1">
      <text x="52" y="155">Read guidelines, discuss an issue</text><text x="52" y="178">Remote name locally: upstream</text>
      <text x="478" y="155">A copy under your account</text><text x="478" y="178">Remote name locally: origin</text>
      <text x="478" y="335">Reproduce → fix → test</text><text x="478" y="358">Push this branch to your fork</text>
      <text x="52" y="335">Review → improvements → merge</text><text x="52" y="358">The maintainer decides what is accepted</text>
    </g>
    <g fill="none" stroke="#fb923c" stroke-width="3">
      <path d="M349 140h100m-8-7 8 7-8 7M613 197v63m-7-8 7 8 7-8M450 320h-99m8-7-8 7 8 7M187 263v-64m-7 8 7-8 7 8"/>
    </g>
    <text x="378" y="126" font-size="14" fill="#cbd5e1">Fork</text><text x="626" y="231" font-size="14" fill="#cbd5e1">Clone</text>
    <text x="32" y="408" font-size="14" fill="#cbd5e1">Before a new task, update your fork. After review, push updates to the same branch.</text>
  </g>
</svg>
